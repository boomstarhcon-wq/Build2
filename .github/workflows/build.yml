## 3. 构建

```bash
cd MConfFS && chmod +x build.sh && ./build.sh
```

硬约束（踩了必炸）：

- 必须带 `-parse-as-library`（有 `@main struct MConfFSApp: App`，否则报
  `'main' attribute cannot be used in a module that contains top-level code`）。
- 必须 `-swift-version 5`（Xcode 16 的 Swift 6 并发检查会把 `@Published` 的后台写判成 error）。
- 目标 `arm64-apple-ios15.0`。UI 只用 iOS 15 可用 API（`NavigationView`、`.searchable`、
  `.refreshable`、`.safeAreaInset`、`TabView`）；**不要**换成 `NavigationStack` /
  `NavigationSplitView` / `.onChange` 的新双参形式。
- 允许 deprecation warning，不允许 error。

CI 出包：`.github/workflows/build.yml` 已就绪，push 后 Actions 里下 `MConfFS-ipa` artifact。

