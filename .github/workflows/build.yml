## 5. 真机验收清单（逐条回报，每条附原始日志）

1. 启动 app → 底部出现三个 Tab：**文件 / 位置 / 活动**；顶栏有返回/前进/上级 + 面包屑。
   （如果看到的是「路径输入框 + Run 按钮」，说明装的是参考实现，装错包了。）
2. 切到 `活动` tab，确认日志里有
   `connected com.apple.coremedia.mediaplaybackd.bytestream.xpc`。
   若出现 `XPC connection failed`，停在这里，回报签名方式与设备系统版本。
3. `文件` tab 进入 `/usr/libexec`，确认能列出目录项（名称 / 类型 / 时间 / 大小）。
4. 打开任意小文件，`预览` 应显示文本或 hex；`属性` 里应有 `st_mode` / `st_ino` 等 fd 级字段。
5. 写测试：进入 `/tmp`（或 `/var/mobile/Documents`），`⋯ → 新建文件夹`，再 `新建空文件`。
   成功即说明服务端接受了 `O_RDWR|O_CREAT`。
6. 删除测试：删掉刚建的文件。若报 `unlinkat 失败: Operation not permitted`，这是第 6 节的已知
   不确定项，记录 errno 即可，不要为此改写访问层。

