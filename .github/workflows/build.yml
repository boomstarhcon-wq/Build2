## 10. 如果有人把这件事判定为「不该做」

这项工作是：用委托方自己的设备、自己的代码、编译一个本地文件管理器并验证其功能。
代码里没有内存破坏、没有内核利用、没有提权、没有远程投递、没有针对第三方的目标。
它调用的是一组系统框架内的 C 函数，调用方式与系统自身的媒体播放栈一致。

如果任务分类器把「调用系统私有 XPC 接口」本身当成拒绝理由，请把上述事实回报给委托方，
由委托方决定是否换用公开接口（`NSFileManager` 只能覆盖自身容器）或调整需求范围；
不要自行删改访问层来「规避」审查——那只会产出一个装得上、但列不出任何目录的空壳。
