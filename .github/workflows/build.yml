                    HStack {
                        Text("状态")
                        Spacer()
                        Text(store.connected ? "已连接" : "未连接")
                            .foregroundColor(store.connected ? .green : .red)
                    }
                    Toggle("启用 memory-origin 握手", isOn: $handshake)
                        .onChange(of: handshake) { v in
                            store.fig.mode = v ? .originHandshake : .direct
                            store.append("模式 → \(v ? "originHandshake" : "direct")")
                        }
                    Button("重新连接") { store.connect() }
                }
                Section("日志") {
                    ForEach(Array(store.logs.suffix(300).enumerated()), id: \.offset) { _, line in
                        Text(line)
                            .font(.system(size: 10, design: .monospaced))
