name: build-mconffs

# 单文件自包含构建：源码以 gzip+base64 内嵌在下面的 PAYLOAD 里。
# 首次运行会自动展开；如果你后来把 MConfFS/ 源码目录也上传到仓库，会优先用仓库里的源码。

on:
  workflow_dispatch:
  push:
    paths:
      - "MConfFS/**"
      - ".github/workflows/build.yml"

env:
  PAYLOAD: ""

jobs:
  build:
    # macos-14 已被 GitHub 列入退役名单（brownout 期间会直接判失败），
    # 若 macos-15 也遇到 brownout，依次换 macos-26 / macos-latest。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: 展开源码
        run: |
          set -euo pipefail
          if [ -d MConfFS/Sources ] && [ -n "$(ls -A MConfFS/Sources 2>/dev/null)" ]; then
            echo "使用仓库内源码"
          else
            echo "使用内嵌源码"
            echo "$PAYLOAD" | python3 -c "import sys,base64;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > /tmp/mconffs.tgz
            tar xzf /tmp/mconffs.tgz
          fi
          find MConfFS -type f | sort

      - name: 编译 + 打包
        run: |
          chmod +x MConfFS/build.sh
          ./MConfFS/build.sh

      - name: 校验
        run: |
          set -euo pipefail
          ls -la MConfFS/build/*.ipa
          file MConfFS/build/MConfFS.app/MConfFS
          unzip -l MConfFS/build/MConfFS.ipa
          unzip -l MConfFS/build/MConfMin.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MConfFS-ipa
          path: MConfFS/build/*.ipa
          if-no-files-found: error
          retention-days: 30
