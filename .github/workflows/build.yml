import Foundation
import Compression

enum Fmt {
    static func size(_ n: Int64) -> String {
        if n < 0 { return "—" }
        let units = ["B", "KB", "MB", "GB", "TB"]
        var v = Double(n), i = 0
        while v >= 1024 && i < units.count - 1 { v /= 1024; i += 1 }
        let unit = units[i] as NSString
        return i == 0 ? "\(Int(v)) B" : String(format: "%.1f %@", v, unit)
    }

    private static let df: DateFormatter = {
        let f = DateFormatter()
        f.dateFormat = "yyyy-MM-dd HH:mm"
        return f
    }()

    static func date(_ d: Date?) -> String {
        guard let d = d else { return "—" }
        return df.string(from: d)
    }

    static func perm(_ mode: mode_t) -> String {
        var s = ""
        let bits: [(mode_t, String)] = [
            (0o400, "r"), (0o200, "w"), (0o100, "x"),
            (0o040, "r"), (0o020, "w"), (0o010, "x"),
            (0o004, "r"), (0o002, "w"), (0o001, "x"),
        ]
        for (m, c) in bits { s += (mode & m) != 0 ? c : "-" }
        return s
    }

    static func kind(_ e: Entry) -> String {
        if e.isDirectory { return "文件夹" }
        if e.isSymlink { return "符号链接" }
        return e.ext.isEmpty ? "文件" : e.ext.uppercased() + " 文件"
    }
}

enum IconMap {
    static func icon(_ e: Entry) -> String {
        if e.isSymlink { return "link" }
        if e.isDirectory { return "folder.fill" }
        switch e.ext {
        case "png", "jpg", "jpeg", "gif", "heic", "webp", "bmp", "tiff": return "photo"
        case "mp4", "mov", "m4v", "avi", "mkv": return "film"
        case "mp3", "m4a", "wav", "aac", "flac", "caf": return "music.note"
        case "plist", "strings", "json", "xml", "entitlements": return "doc.text.magnifyingglass"
        case "zip", "ipa", "deb", "tar", "gz", "7z", "xz": return "archivebox"
        case "dylib", "so", "a": return "shippingbox"
        case "db", "sqlite", "sqlite3": return "cylinder.split.1x2"
        case "log", "txt", "md", "conf", "cfg", "ini": return "doc.plaintext"
        case "sh", "py", "js", "swift", "c", "h", "cpp", "m", "mm": return "chevron.left.forwardslash.chevron.right"
        case "ttf", "otf", "ttc": return "textformat"
        case "car", "nib", "storyboardc": return "square.stack.3d.up"
        default: return "doc"
        }
    }

    static func tint(_ e: Entry) -> String {
        if e.isDirectory { return "accent" }
        switch e.ext {
        case "png", "jpg", "jpeg", "gif", "heic", "webp": return "purple"
        case "plist", "strings", "json", "xml": return "orange"
        case "zip", "ipa", "deb", "tar", "gz": return "brown"
        case "dylib", "so", "a": return "blue"
        case "db", "sqlite", "sqlite3": return "teal"
        default: return "gray"
        }
    }
}

enum HexDump {
    static func of(_ data: Data, limit: Int = 4096) -> String {
        let bytes = [UInt8](data.prefix(limit))
        var out = ""
        var i = 0
        while i < bytes.count {
            let row = bytes[i..<min(i + 16, bytes.count)]
            let hex = row.map { String(format: "%02x", $0) }
                .enumerated().map { $0.offset == 7 ? $0.element + " " : $0.element }
                .joined(separator: " ")
            let ascii = row.map { ($0 >= 32 && $0 < 127) ? String(UnicodeScalar($0)) : "." }.joined()
            let pad = hex.padding(toLength: 48, withPad: " ", startingAt: 0)
            out += String(format: "%08x  %@  %@\n", i, pad as NSString, ascii as NSString)
            i += 16
        }
        if data.count > limit { out += "… 共 \(data.count) 字节，已截断" }
        return out
    }
}

// MARK: - 最小 ZIP 实现（写入用 store，读取支持 store / deflate）

struct ZipItem {
    let name: String
    let method: UInt16
    let compressedSize: Int
    let uncompressedSize: Int
    let localOffset: Int
    let crc: UInt32
}

enum Zip {
    private static let table: [UInt32] = (0..<256).map { i -> UInt32 in
        var c = UInt32(i)
        for _ in 0..<8 { c = (c & 1) != 0 ? (0xEDB8_8320 ^ (c >> 1)) : (c >> 1) }
        return c
    }

    static func crc32(_ data: Data) -> UInt32 {
        var c: UInt32 = 0xFFFF_FFFF
        for b in data { c = table[Int((c ^ UInt32(b)) & 0xFF)] ^ (c >> 8) }
        return c ^ 0xFFFF_FFFF
    }

    /// 目录递归收集 → 打包。entryName 为压缩包内相对路径。
    static func archive(_ files: [(name: String, data: Data)]) -> Data {
        var out = Data()
        var central = Data()
        let now = Date()
        let cal = Calendar(identifier: .gregorian)
        let comps = cal.dateComponents([.year, .month, .day, .hour, .minute, .second], from: now)
        // 拆开写，避免一行里的混合位运算把类型检查器拖爆（Swift 会报
        // "unable to type-check this expression in reasonable time"）
        let hh: UInt16 = UInt16(clamping: comps.hour ?? 0)
        let mm: UInt16 = UInt16(clamping: comps.minute ?? 0)
        let ss: UInt16 = UInt16(clamping: comps.second ?? 0)
        let dosTime: UInt16 = (hh << 11) | (mm << 5) | (ss / 2)

        // 年份要夹到合法范围：Calendar 在某些场景会给出 1 或 0，
        // UInt16(负数) 在 Swift 里是运行时 trap，不是回绕。
        let year = comps.year ?? 2026
        let yy: UInt16 = UInt16(clamping: max(0, min(65535, year - 1980)))
        let mo: UInt16 = UInt16(clamping: max(0, min(65535, comps.month ?? 1)))
        let dd: UInt16 = UInt16(clamping: max(0, min(65535, comps.day ?? 1)))
        let dosDate: UInt16 = (yy << 9) | (mo << 5) | dd

        for f in files {
            let nameBytes = Array(f.name.utf8)
            let crc = crc32(f.data)
            let offset = out.count

            out.append(le32(0x0403_4B50))
            out.append(le16(20))                 // version needed
            out.append(le16(0))                  // flags
            out.append(le16(0))                  // method = store
            out.append(le16(dosTime))
            out.append(le16(dosDate))
            out.append(le32(crc))
            out.append(le32(UInt32(clamping: f.data.count)))
            out.append(le32(UInt32(clamping: f.data.count)))
            out.append(le16(UInt16(clamping: nameBytes.count)))
            out.append(le16(0))                  // extra len
            out.append(contentsOf: nameBytes)
            out.append(f.data)

            central.append(le32(0x0201_4B50))
            central.append(le16(20))             // version made by
            central.append(le16(20))             // version needed
            central.append(le16(0))
            central.append(le16(0))
            central.append(le16(dosTime))
            central.append(le16(dosDate))
            central.append(le32(crc))
            central.append(le32(UInt32(clamping: f.data.count)))
            central.append(le32(UInt32(clamping: f.data.count)))
            central.append(le16(UInt16(clamping: nameBytes.count)))
            central.append(le16(0))
            central.append(le16(0))
            central.append(le16(0))
            central.append(le16(0))
            central.append(le32(0))
            central.append(le32(UInt32(clamping: offset)))
            central.append(contentsOf: nameBytes)
        }

        let cdOffset = out.count
        let count16 = UInt16(clamping: files.count)
        out.append(central)
        out.append(le32(0x0605_4B50))
        out.append(le16(0))
        out.append(le16(0))
        out.append(le16(count16))
        out.append(le16(count16))
        out.append(le32(UInt32(clamping: central.count)))
        out.append(le32(UInt32(clamping: cdOffset)))
        out.append(le16(0))
        return out
    }

    static func entries(_ data: Data) -> [ZipItem] {
        guard let eocd = rfind(data, [0x50, 0x4B, 0x05, 0x06]) else { return [] }
        let count = Int(u16(data, eocd + 10))
        var p = Int(u32(data, eocd + 16))
        var items: [ZipItem] = []
        for _ in 0..<count {
            guard p + 46 <= data.count, u32(data, p) == 0x0201_4B50 else { break }
            let method = u16(data, p + 10)
            let crc = u32(data, p + 16)
            let csize = Int(u32(data, p + 20))
            let usize = Int(u32(data, p + 24))
            let nlen = Int(u16(data, p + 28))
            let elen = Int(u16(data, p + 30))
            let clen = Int(u16(data, p + 32))
            let loff = Int(u32(data, p + 42))
            guard p + 46 + nlen <= data.count else { break }
            let nameBytes = data.subdata(in: (p + 46)..<(p + 46 + nlen))
            let name = String(data: nameBytes, encoding: .utf8) ?? "?"
            items.append(ZipItem(name: name, method: method, compressedSize: csize,
                                 uncompressedSize: usize, localOffset: loff, crc: crc))
            p += 46 + nlen + elen + clen
        }
        return items
    }

    static func extract(_ data: Data, _ item: ZipItem) -> Data? {
        let p = item.localOffset
        guard p + 30 <= data.count, u32(data, p) == 0x0403_4B50 else { return nil }
        let nlen = Int(u16(data, p + 26))
        let elen = Int(u16(data, p + 28))
        let start = p + 30 + nlen + elen
        guard start + item.compressedSize <= data.count else { return nil }
        let payload = data.subdata(in: start..<(start + item.compressedSize))
        if item.method == 0 { return payload }
        if item.method == 8 { return inflate(payload, size: item.uncompressedSize) }
        return nil
    }

    private static func inflate(_ data: Data, size: Int) -> Data? {
        guard size > 0 else { return Data() }
        var out = Data(count: size)
        let written = out.withUnsafeMutableBytes { dst -> Int in
            data.withUnsafeBytes { src -> Int in
                guard let d = dst.bindMemory(to: UInt8.self).baseAddress,
                      let s = src.bindMemory(to: UInt8.self).baseAddress else { return 0 }
                return compression_decode_buffer(d, size, s, data.count, nil, COMPRESSION_ZLIB)
            }
        }
        guard written > 0 else { return nil }
        return out.prefix(written)
    }

    private static func le16(_ v: UInt16) -> Data { withUnsafeBytes(of: v.littleEndian) { Data($0) } }
    private static func le32(_ v: UInt32) -> Data { withUnsafeBytes(of: v.littleEndian) { Data($0) } }
    // 逐字节拼，避免 load(as:) 的对齐要求（ZIP 数据在 Data 里不保证 2/4 字节对齐）
    private static func u16(_ d: Data, _ o: Int) -> UInt16 {
        guard o + 2 <= d.count else { return 0 }
        return UInt16(d[o]) | (UInt16(d[o + 1]) << 8)
    }
    private static func u32(_ d: Data, _ o: Int) -> UInt32 {
        guard o + 4 <= d.count else { return 0 }
        let b0 = UInt32(d[o]), b1 = UInt32(d[o + 1])
        let b2 = UInt32(d[o + 2]), b3 = UInt32(d[o + 3])
        return b0 | (b1 << 8) | (b2 << 16) | (b3 << 24)
    }
    private static func rfind(_ d: Data, _ pat: [UInt8]) -> Int? {
        guard d.count > pat.count else { return nil }
        var i = d.count - pat.count
        while i >= 0 {
            if Array(d[i..<(i + pat.count)]) == pat { return i }
            i -= 1
        }
        return nil
    }
}
