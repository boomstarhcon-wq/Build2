import SwiftUI
import UIKit
import UniformTypeIdentifiers

@main
struct MConfFSApp: App {
    var body: some Scene {
        WindowGroup { RootView() }
    }
}

struct RootView: View {
    @StateObject private var store = Store()
    @State private var tab = 0

    var body: some View {
        TabView(selection: $tab) {
            FileBrowserView()
                .tabItem { Label("文件", systemImage: "folder.fill") }
                .tag(0)
            PlacesView(tab: $tab)
                .tabItem { Label("位置", systemImage: "bookmark.fill") }
                .tag(1)
            ActivityView()
                .tabItem { Label("活动", systemImage: "terminal.fill") }
                .tag(2)
        }
        .environmentObject(store)
        .onAppear {
            // 首次出现后才发起连接，避免在视图构建期间改 @Published
            if !store.connected { store.connect() }
        }
    }
}

// MARK: - 主浏览器

struct FileBrowserView: View {
    @EnvironmentObject var store: Store

    @State private var selectionMode = false
    @State private var preview: Entry?
    @State private var props: Entry?
    @State private var renameTarget: Entry?
    @State private var renameText = ""
    @State private var showNewItem = false
    @State private var newItemIsDir = true
    @State private var newItemName = ""
    @State private var showImporter = false
    @State private var copyMove: CopyMoveRequest?

    private var rows: [Entry] { store.filtered }

    var body: some View {
        NavigationView {
            VStack(spacing: 0) {
                crumbBar
                Divider()
                listBody
                Divider()
                if selectionMode { selectionBar } else { statusBar }
            }
            .navigationBarTitleDisplayMode(.inline)
            .toolbar { toolbarContent }
            .searchable(text: $store.search, placement: .navigationBarDrawer(displayMode: .always), prompt: "过滤当前目录")
            .overlay {
                if store.busy && store.items.isEmpty { ProgressView() }
            }
            .sheet(item: $preview) { PreviewView(entry: $0) }
            .sheet(item: $props) { PropertiesView(entry: $0) }
            .sheet(item: $copyMove) { req in
                DirectoryPickerView(start: store.path, entries: req.entries, isCopy: req.isCopy)
            }
            .sheet(isPresented: $showNewItem) { newItemSheet }
            .sheet(item: $renameTarget) { item in renameSheet(item) }
            .fileImporter(isPresented: $showImporter,
                          allowedContentTypes: [.data],
                          allowsMultipleSelection: false) { result in
                if case .success(let urls) = result, let u = urls.first {
                    store.upload(local: u, toDir: store.path)
                }
            }
            .alert(item: $store.notice) { n in
                Alert(title: Text("提示"), message: Text(n.text), dismissButton: .default(Text("好")))
            }
        }
        .navigationViewStyle(.stack)
    }

    // MARK: 路径面包屑

    private var crumbBar: some View {
        ScrollView(.horizontal, showsIndicators: false) {
            HStack(spacing: 4) {
                ForEach(store.crumbs) { c in
                    Button {
                        store.go(c.path)
                    } label: {
                        Text(c.title)
                            .font(.system(size: 12, design: .monospaced))
                            .lineLimit(1)
                            .padding(.horizontal, 7)
                            .padding(.vertical, 4)
                            .background(
                                RoundedRectangle(cornerRadius: 6)
                                    .fill(store.path == c.path
                                          ? Color.accentColor.opacity(0.22)
                                          : Color(UIColor.secondarySystemBackground))
                            )
                    }
                    .buttonStyle(.plain)
                    if c.path != store.crumbs.last?.path {
                        Image(systemName: "chevron.right")
                            .font(.system(size: 8))
                            .foregroundColor(.secondary)
                    }
                }
            }
            .padding(.horizontal, 10)
            .padding(.vertical, 6)
        }
        .background(Color(UIColor.systemBackground))
    }

    // MARK: 列表

    private var listBody: some View {
        List {
            ForEach(rows) { item in
                FileRow(entry: item, selected: store.selection.contains(item.id))
                    .contentShape(Rectangle())
                    .onTapGesture { tap(item) }
                    .contextMenu { menu(for: item) }
            }
        }
        .listStyle(.plain)
        .refreshable { store.reload() }
    }

    private func tap(_ item: Entry) {
        if selectionMode {
            if store.selection.contains(item.id) { store.selection.remove(item.id) }
            else { store.selection.insert(item.id) }
            return
        }
        if item.isDirectory {
            store.go(item.path)
        } else {
            preview = item
        }
    }

    @ViewBuilder
    private func menu(for item: Entry) -> some View {
        Button { preview = item } label: { Label("预览", systemImage: "eye") }
        Button { props = item } label: { Label("属性", systemImage: "info.circle") }
        Button { store.download(item) } label: { Label("下载到本机", systemImage: "arrow.down.circle") }
        Divider()
        Button { copyMove = CopyMoveRequest(entries: [item], isCopy: true) } label: { Label("复制到…", systemImage: "doc.on.doc") }
        Button { copyMove = CopyMoveRequest(entries: [item], isCopy: false) } label: { Label("移动到…", systemImage: "arrow.right.square") }
        Button { store.duplicate(item) } label: { Label("创建副本", systemImage: "plus.square.on.square") }
        Button { renameText = item.name; renameTarget = item } label: { Label("重命名", systemImage: "pencil") }
        if !item.isDirectory {
            if item.ext == "zip" {
                Button { store.uncompress(item) } label: { Label("解压到此处", systemImage: "archivebox") }
            } else {
                Button { store.compress([item]) } label: { Label("压缩为 zip", systemImage: "archivebox") }
            }
        }
        Divider()
        Button(role: .destructive) { store.delete([item]) } label: { Label("删除", systemImage: "trash") }
    }

    // MARK: 工具栏

    @ToolbarContentBuilder
    private var toolbarContent: some ToolbarContent {
        ToolbarItemGroup(placement: .navigationBarLeading) {
            Button { store.goBack() } label: { Image(systemName: "chevron.left") }
                .disabled(!store.canGoBack)
            Button { store.goForward() } label: { Image(systemName: "chevron.right") }
                .disabled(!store.canGoForward)
            Button { store.goUp() } label: { Image(systemName: "arrow.up") }
        }
        ToolbarItemGroup(placement: .navigationBarTrailing) {
            Button {
                withAnimation { selectionMode.toggle(); store.selection.removeAll() }
            } label: {
                Image(systemName: selectionMode ? "checkmark.circle.fill" : "checkmark.circle")
            }
            Menu {
                Section("新建") {
                    Button { newItemIsDir = true; newItemName = ""; showNewItem = true } label: {
                        Label("文件夹", systemImage: "folder.badge.plus")
                    }
                    Button { newItemIsDir = false; newItemName = ""; showNewItem = true } label: {
                        Label("空文件", systemImage: "doc.badge.plus")
                    }
                    Button { showImporter = true } label: { Label("上传文件…", systemImage: "square.and.arrow.up") }
                }
                Section("排序") {
                    ForEach(SortKey.allCases) { k in
                        Button {
                            if store.sortKey == k { store.sortAsc.toggle() } else { store.sortKey = k }
                        } label: {
                            Label(sortLabel(k), systemImage: store.sortKey == k ? "checkmark" : "arrow.up.arrow.down")
                        }
                    }
                }
                Section {
                    Toggle(isOn: $store.showHidden) { Label("显示隐藏文件", systemImage: "eye.slash") }
                    Button { store.reload() } label: { Label("刷新", systemImage: "arrow.clockwise") }
                    Button { store.toggleBookmark(store.path) } label: {
                        Label(store.isBookmarked(store.path) ? "取消收藏" : "收藏当前目录", systemImage: "star")
                    }
                    if !store.connected {
                        Button { store.connect() } label: { Label("重新连接", systemImage: "bolt") }
                    }
                }
            } label: { Image(systemName: "ellipsis.circle") }
        }
    }

    // MARK: 底栏

    private var statusBar: some View {
        HStack(spacing: 12) {
            Text("\(store.items.count) 项")
            if !store.search.isEmpty { Text("匹配 \(rows.count)") }
            Spacer()
            if store.connected {
                Label("mediaplaybackd", systemImage: "bolt.horizontal.circle.fill")
                    .foregroundColor(.green)
            } else {
                Label("未连接", systemImage: "bolt.slash")
                    .foregroundColor(.red)
            }
        }
        .font(.system(size: 11, design: .monospaced))
        .foregroundColor(.secondary)
        .padding(.horizontal, 12)
        .padding(.vertical, 6)
        .background(Color(UIColor.secondarySystemBackground))
    }

    private var selectionBar: some View {
        HStack(spacing: 18) {
            Button { store.delete(selectedEntries) } label: { Image(systemName: "trash") }
            Button { copyMove = CopyMoveRequest(entries: selectedEntries, isCopy: true) } label: { Image(systemName: "doc.on.doc") }
            Button { copyMove = CopyMoveRequest(entries: selectedEntries, isCopy: false) } label: { Image(systemName: "arrow.right.square") }
            Button { store.compress(selectedEntries) } label: { Image(systemName: "archivebox") }
            Spacer()
            Text("\(store.selection.count) 项已选").font(.caption)
            Button("完成") { withAnimation { selectionMode = false; store.selection.removeAll() } }
        }
        .padding(.horizontal, 16)
        .padding(.vertical, 8)
        .background(Color(UIColor.secondarySystemBackground))
    }

    private var selectedEntries: [Entry] {
        store.items.filter { store.selection.contains($0.id) }
    }

    private func sortLabel(_ k: SortKey) -> String {
        guard store.sortKey == k else { return k.rawValue }
        return k.rawValue + (store.sortAsc ? " ↑" : " ↓")
    }

    // MARK: 小表单

    private var newItemSheet: some View {
        NavigationView {
            Form {
                TextField(newItemIsDir ? "文件夹名称" : "文件名称", text: $newItemName)
                    .autocapitalization(.none)
                    .disableAutocorrection(true)
            }
            .navigationTitle(newItemIsDir ? "新建文件夹" : "新建文件")
            .toolbar {
                ToolbarItem(placement: .cancellationAction) {
                    Button("取消") { showNewItem = false }
                }
                ToolbarItem(placement: .confirmationAction) {
                    Button("创建") {
                        let n = newItemName.trimmingCharacters(in: .whitespacesAndNewlines)
                        guard !n.isEmpty else { return }
                        if newItemIsDir { store.mkdir(name: n) } else { store.newFile(name: n) }
                        showNewItem = false
                    }
                }
            }
        }
    }

    private func renameSheet(_ item: Entry) -> some View {
        NavigationView {
            Form { TextField("新名称", text: $renameText) }
                .navigationTitle("重命名")
                .toolbar {
                    ToolbarItem(placement: .cancellationAction) {
                        Button("取消") { renameTarget = nil }
                    }
                    ToolbarItem(placement: .confirmationAction) {
                        Button("保存") {
                            let n = renameText.trimmingCharacters(in: .whitespacesAndNewlines)
                            if !n.isEmpty && n != item.name { store.rename(item, to: n) }
                            renameTarget = nil
                        }
                    }
                }
        }
    }
}

// MARK: - 行

struct FileRow: View {
    let entry: Entry
    let selected: Bool

    var body: some View {
        HStack(spacing: 10) {
            Image(systemName: IconMap.icon(entry))
                .font(.system(size: 18))
                .frame(width: 26)
                .foregroundColor(color)
            VStack(alignment: .leading, spacing: 1) {
                Text(entry.name)
                    .font(.system(size: 14, design: .monospaced))
                    .lineLimit(1)
                HStack(spacing: 6) {
                    Text(Fmt.kind(entry))
                    if let t = entry.linkTarget { Text("→ \(t)").lineLimit(1) }
                    Text(Fmt.date(entry.modified))
                }
                .font(.system(size: 10))
                .foregroundColor(.secondary)
                .lineLimit(1)
            }
            Spacer(minLength: 4)
            if entry.isDirectory {
                Image(systemName: "chevron.right")
                    .font(.system(size: 11))
                    .foregroundColor(.secondary)
            } else {
                Text(Fmt.size(entry.size))
                    .font(.system(size: 11, design: .monospaced))
                    .foregroundColor(.secondary)
            }
            if selected {
                Image(systemName: "checkmark.circle.fill").foregroundColor(.accentColor)
            }
        }
        .padding(.vertical, 3)
    }

    private var color: Color {
        switch IconMap.tint(entry) {
        case "accent": return .accentColor
        case "purple": return .purple
        case "orange": return .orange
        case "brown": return .brown
        case "blue": return .blue
        case "teal": return .teal
        default: return .secondary
        }
    }
}

struct CopyMoveRequest: Identifiable {
    let id = UUID()
    let entries: [Entry]
    let isCopy: Bool
}
