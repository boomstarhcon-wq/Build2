# MConfFS 单文件交接包

这个文件是全部内容：任务卡 + 9 个源码/配置文件，按路径切分。**不需要再索要其它文件。**

## 怎么用

1. 先通读 `MConfFS/AGENT_BRIEF.md` 那一节（任务、原理、硬约束、验收清单）。
2. 用下面的还原脚本把所有节写成真实文件，然后按 brief 里的命令构建。

### 还原脚本（Python 3，任何目录下都能跑）

```python
import re, pathlib, sys

src = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
pat = re.compile(r"^<<<FILE (.*?)>>>\n(.*?)\n<<<END FILE>>>$", re.S | re.M)
n = 0
for m in pat.finditer(src):
    p = pathlib.Path(m.group(1))
    p.parent.mkdir(parents=True, exist_ok=True)
    p.write_text(m.group(2) + "\n", encoding="utf-8")
    n += 1
print(f"restored {n} files")
```

```bash
python3 restore.py MConfFS_BUNDLE.md
```

### 或者手工切分

每个文件以 `<<<FILE 相对路径>>>` 单独一行开头，以 `<<<END FILE>>>` 单独一行结束，
中间就是文件的完整原文（UTF-8，LF 换行）。按路径建目录写进去即可。

## 边界提醒

- 协议层 `FigByteStream.swift` 是按逆向证据写死的，不要「重新设计」，不要加 `import XPC`。
- 打开目录必须 `O_RDONLY`；`FileOpenOptions` 统一改成 `O_RDWR` 会让列目录直接 `EISDIR` 失败。
- 编译必须 `-parse-as-library -swift-version 5`。
- 有 4 个不确定项写在第 6 节，改动要写进报告，不要把「未验证」写成结论。

