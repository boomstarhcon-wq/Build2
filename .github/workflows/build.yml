## 7. 排错

| 现象 | 处理 |
|---|---|
| `cannot find 'dlopen' in scope` | `FigByteStream.swift` 少了 `import Darwin` |
| `no such module 'XPC'` | 不该出现；若出现说明有人加了 `import XPC`，删掉 |
| `'main' attribute cannot be used...` | 缺 `-parse-as-library` |
| `Mutation of captured var` 或 `@Published` 相关 error | 缺 `-swift-version 5` |
| 编译过、装上闪退 | Console.app 看 `MConfFS` 崩溃栈；多半是 `CFBundleExecutable` 与二进制名不一致 |
| 能列目录、读文件失败 | 服务端拒绝了 flags，或该路径不可读；换 `/usr/libexec` 下的小文件复测 |
| 整个目录都列不出来 | 先看第 2 步的连接日志，多半是运行环境限制，不是代码问题 |

