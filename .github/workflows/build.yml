<<<FILE .github/workflows/build.yml>>>
name: build-mconffs

on:
  push:
    paths:
      - "MConfFS/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    # macos-14 已进入退役/brownout 名单；如 macos-15 也遇上，换 macos-26 或 macos-latest
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 编译 + 打包
        run: |
          chmod +x MConfFS/build.sh
          ./MConfFS/build.sh

      - name: 校验产物
        run: |
          test -f MConfFS/build/MConfFS.ipa
          unzip -l MConfFS/build/MConfFS.ipa
          file MConfFS/build/MConfFS.app/MConfFS

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MConfFS-ipa
          path: MConfFS/build/MConfFS.ipa
          if-no-files-found: error
<<<END FILE>>>
