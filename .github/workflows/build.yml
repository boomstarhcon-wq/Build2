import Foundation
import Darwin

struct Entry: Identifiable, Hashable {
    /// 用路径做稳定 id，刷新后多选与滚动位置才不会跳
    var id: String { path }
    let name: String
    let isDirectory: Bool
    let isSymlink: Bool
    let size: Int64
    let mode: mode_t
    let uid: uid_t
    let gid: gid_t
    let modified: Date?
    let path: String
    var linkTarget: String?

    var ext: String { (name as NSString).pathExtension.lowercased() }
}

enum FSError: LocalizedError {
    case fig(String)
    case posix(String, Int32)
    var errorDescription: String? {
        switch self {
        case .fig(let m): return "服务端: \(m)"
        case .posix(let op, let e): return "\(op) 失败: \(String(cString: strerror(e))) (errno=\(e))"
        }
    }
}

/// fd 级文件系统。所有目标访问都建立在一个「服务端授予的 fd」之上：
///   - 读/写/截断/改权限 → 直接在 fd 上操作（pread/pwrite/ftruncate/fchmod），
///     不需要客户端进程自己对目标路径有直接访问权。
///   - 目录枚举 → dup 后 fdopendir+readdir+fstatat。
///   - 建/删/改名 → openat/unlinkat/renameat/mkdirat 以父目录 fd 为锚点；
///     这一族是路径解析型调用，系统策略仍可能在 vnode 上拒绝，README 里列为「需真机实测」。
final class RemoteFS {

    let fig: FigByteStream
    var onLog: ((String) -> Void)?

    init(fig: FigByteStream) { self.fig = fig }

    private func log(_ s: String) { onLog?(s); print("[FS] \(s)") }

    // MARK: - 目录列举

    func list(path: String) throws -> [Entry] {
        guard let fd = fig.openFD(path: path, flags: O_RDONLY) else {
            throw FSError.fig(fig.lastError)
        }
        defer { close(fd) }
        return try list(dirFD: fd, basePath: path)
    }

    func list(dirFD: Int32, basePath: String) throws -> [Entry] {
        // fdopendir 会取得 fd 所有权并在 closedir 时关闭它，所以先 dup 一份留给调用者。
        let dupfd = dup(dirFD)
        guard dupfd >= 0 else { throw FSError.posix("dup", errno) }
        guard let dir = fdopendir(dupfd) else {
            let e = errno; close(dupfd)
            throw FSError.posix("fdopendir", e)
        }
        defer { closedir(dir) }

        var out: [Entry] = []
        while let ent = readdir(dir) {
            let name: String = withUnsafePointer(to: ent.pointee.d_name) {
                $0.withMemoryRebound(to: CChar.self, capacity: 1024) { cstr -> String in
                    // 不能用 String(cString:)：目录里只要有一个非 UTF-8 文件名
                    // （沙盒里遗留的 Latin-1 / GBK 名字很常见），它就会直接 trap。
                    // 这就是"一打开就闪退"最典型的成因。
                    let len = strlen(cstr)
                    let raw = UnsafeRawBufferPointer(start: cstr, count: len)
                    return String(decoding: raw, as: UTF8.self)
                }
            }
            if name == "." || name == ".." { continue }
            var st = stat()
            if fstatat(dirFD, name, &st, AT_SYMLINK_NOFOLLOW) != 0 { continue }
            let ft = st.st_mode & S_IFMT
            let full = basePath.hasSuffix("/") ? basePath + name : basePath + "/" + name
            out.append(Entry(
                name: name,
                isDirectory: ft == S_IFDIR,
                isSymlink: ft == S_IFLNK,
                size: Int64(st.st_size),
                mode: st.st_mode,
                uid: st.st_uid,
                gid: st.st_gid,
                modified: Date(timeIntervalSince1970: TimeInterval(st.st_mtimespec.tv_sec)),
                path: full,
                linkTarget: ft == S_IFLNK ? readLink(dirFD: dirFD, name: name) : nil
            ))
        }
        out.sort { ($0.isDirectory ? 0 : 1, $0.name.lowercased()) < ($1.isDirectory ? 0 : 1, $1.name.lowercased()) }
        log("\(basePath): \(out.count) 项")
        return out
    }

    private func readLink(dirFD: Int32, name: String) -> String? {
        var buf = [CChar](repeating: 0, count: Int(PATH_MAX))
        let n = readlinkat(dirFD, name, &buf, buf.count - 1)
        guard n > 0 else { return nil }
        let bytes: [UInt8] = buf.prefix(Int(n)).map { UInt8(bitPattern: $0) }
        return String(decoding: bytes, as: UTF8.self)
    }

    func readLink(path: String) -> String? {
        guard let (pfd, name) = parentFD(of: path) else { return nil }
        defer { close(pfd) }
        return readLink(dirFD: pfd, name: name)
    }

    // MARK: - 读

    func statOf(path: String) throws -> stat {
        guard let fd = fig.openFD(path: path, flags: O_RDONLY) else { throw FSError.fig(fig.lastError) }
        defer { close(fd) }
        var st = stat()
        guard fstat(fd, &st) == 0 else { throw FSError.posix("fstat", errno) }
        return st
    }

    func read(path: String, maxSize: Int = 64 << 20) throws -> Data {
        guard let fd = fig.openFD(path: path, flags: O_RDONLY) else { throw FSError.fig(fig.lastError) }
        defer { close(fd) }
        var st = stat()
        guard fstat(fd, &st) == 0 else { throw FSError.posix("fstat", errno) }
        let total = Int(min(Int64(maxSize), Int64(st.st_size)))
        var buf = [UInt8](repeating: 0, count: max(1, total))
        var got = 0
        while got < total {
            let n = buf.withUnsafeMutableBytes { (p: UnsafeMutableRawBufferPointer) -> Int in
                guard let base = p.baseAddress else { return -1 }
                return pread(fd, base.advanced(by: got), total - got, off_t(got))
            }
            if n <= 0 { break }
            got += n
        }
        log("read \(path): \(got)/\(st.st_size) 字节")
        return Data(buf[0..<got])
    }

    // MARK: - 写

    /// 覆盖写：服务端以 O_WRONLY|O_CREAT|O_TRUNC 打开目标，返回可写 fd。
    /// 参考实现固定传 0（只读），这里按调用方需要传写标志。
    @discardableResult
    func write(path: String, data: Data) throws -> Int {
        let flags = O_WRONLY | O_CREAT | O_TRUNC
        guard let fd = fig.openFD(path: path, flags: Int32(flags)) else {
            throw FSError.fig(fig.lastError)
        }
        defer { close(fd) }
        var done = 0
        while done < data.count {
            let n = data.withUnsafeBytes { (p: UnsafeRawBufferPointer) -> Int in
                guard let base = p.baseAddress else { return -1 }
                return pwrite(fd, base.advanced(by: done), data.count - done, off_t(done))
            }
            if n <= 0 { throw FSError.posix("pwrite", errno) }
            done += n
        }
        fsync(fd)
        log("write \(path): \(done) 字节")
        return done
    }

    /// 原地打补丁（不截断），用于改配置文件
    @discardableResult
    func patch(path: String, offset: Int64, data: Data) throws -> Int {
        guard !data.isEmpty else { return 0 }
        guard let fd = fig.openFD(path: path, flags: O_RDWR) else { throw FSError.fig(fig.lastError) }
        defer { close(fd) }
        let n = data.withUnsafeBytes { (buf: UnsafeRawBufferPointer) -> Int in
            guard let base = buf.baseAddress else { return -1 }
            return pwrite(fd, base, data.count, off_t(offset))
        }
        guard n > 0 else { throw FSError.posix("pwrite", errno) }
        return n
    }

    func truncate(path: String, size: Int64) throws {
        guard let fd = fig.openFD(path: path, flags: O_WRONLY) else { throw FSError.fig(fig.lastError) }
        defer { close(fd) }
        guard ftruncate(fd, off_t(size)) == 0 else { throw FSError.posix("ftruncate", errno) }
    }

    func chmod(path: String, mode: mode_t) throws {
        guard let fd = fig.openFD(path: path, flags: O_RDONLY) else { throw FSError.fig(fig.lastError) }
        defer { close(fd) }
        guard fchmod(fd, mode) == 0 else { throw FSError.posix("fchmod", errno) }
    }

    // MARK: - 目录项操作（需真机实测）

    private func parentFD(of path: String) -> (Int32, String)? {
        let ns = path as NSString
        let parent = ns.deletingLastPathComponent
        let base = ns.lastPathComponent
        guard !base.isEmpty, parent != path else { return nil }
        guard let fd = fig.openFD(path: parent, flags: O_RDONLY) else { return nil }
        return (fd, base)
    }

    func mkdir(path: String) throws {
        guard let (pfd, name) = parentFD(of: path) else { throw FSError.posix("mkdir parent", ENOENT) }
        defer { close(pfd) }
        guard Darwin.mkdirat(pfd, name, 0o755) == 0 else { throw FSError.posix("mkdirat", errno) }
    }

    func remove(path: String) throws {
        guard let (pfd, name) = parentFD(of: path) else { throw FSError.posix("unlink parent", ENOENT) }
        defer { close(pfd) }
        var st = stat()
        let isDir = fstatat(pfd, name, &st, AT_SYMLINK_NOFOLLOW) == 0 && (st.st_mode & S_IFMT) == S_IFDIR
        let r = isDir ? unlinkat(pfd, name, AT_REMOVEDIR) : unlinkat(pfd, name, 0)
        guard r == 0 else { throw FSError.posix("unlinkat", errno) }
    }

    func rename(from: String, to: String) throws {
        guard let (pfd1, n1) = parentFD(of: from), let (pfd2, n2) = parentFD(of: to) else {
            throw FSError.posix("rename parent", ENOENT)
        }
        defer { close(pfd1); close(pfd2) }
        guard renameat(pfd1, n1, pfd2, n2) == 0 else { throw FSError.posix("renameat", errno) }
    }

    func create(path: String) throws {
        guard let fd = fig.openFD(path: path, flags: Int32(O_WRONLY | O_CREAT | O_EXCL)) else {
            throw FSError.fig(fig.lastError)
        }
        close(fd)
    }

    // MARK: - 复制 / 移动

    /// 跨目录复制：读源 fd + 写目标 fd，不依赖任何路径级权限
    func copy(from src: Entry, toDir dstDir: String) throws {
        let dst = dstDir.hasSuffix("/") ? dstDir + src.name : dstDir + "/" + src.name
        if src.isDirectory {
            try mkdir(path: dst)
            for child in try list(path: src.path) {
                try copy(from: child, toDir: dst)
            }
        } else if src.isSymlink, let target = src.linkTarget {
            guard let (pfd, name) = parentFD(of: dst) else { throw FSError.posix("symlink parent", ENOENT) }
            defer { close(pfd) }
            guard symlinkat(target, pfd, name) == 0 else { throw FSError.posix("symlinkat", errno) }
        } else {
            let data = try read(path: src.path, maxSize: 512 << 20)
            try write(path: dst, data: data)
        }
    }

    /// 先试服务端级 renameat（同一父目录/同卷通常可行），失败再退化为复制+删除
    func move(from src: Entry, toDir dstDir: String) throws {
        let dst = dstDir.hasSuffix("/") ? dstDir + src.name : dstDir + "/" + src.name
        do {
            try rename(from: src.path, to: dst)
        } catch {
            log("renameat 被拒，退化为 复制+删除: \(src.path)")
            try copy(from: src, toDir: dstDir)
            try remove(path: src.path)
        }
    }

    func duplicate(_ src: Entry) throws {
        let dir = (src.path as NSString).deletingLastPathComponent
        let base = (src.name as NSString).deletingPathExtension
        let ext = (src.name as NSString).pathExtension
        let newName = ext.isEmpty ? base + " 副本" : base + " 副本." + ext
        let dst = dir + "/" + newName
        if src.isDirectory {
            try mkdir(path: dst)
            for child in try list(path: src.path) { try copy(from: child, toDir: dst) }
        } else {
            let data = try read(path: src.path, maxSize: 512 << 20)
            try write(path: dst, data: data)
        }
    }

    // MARK: - 递归

    /// 递归列举整棵树（只列名与元数据，不读内容）
    func walk(path: String, depth: Int = 0, maxDepth: Int = 8, into acc: inout [Entry]) {
        guard depth <= maxDepth else { return }
        guard let items = try? list(path: path) else { return }
        for it in items {
            acc.append(it)
            if it.isDirectory { walk(path: it.path, depth: depth + 1, maxDepth: maxDepth, into: &acc) }
        }
    }
}
