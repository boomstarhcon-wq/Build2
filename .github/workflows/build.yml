import Foundation
import Combine

enum SortKey: String, CaseIterable, Identifiable {
    case name = "名称"
    case size = "大小"
    case date = "日期"
    case kind = "类型"
    var id: String { rawValue }
}

struct Notice: Identifiable {
    let id = UUID()
    let text: String
}

struct Place: Identifiable {
    var id: String { path }
    let name: String
    let path: String
}

struct Crumb: Identifiable {
    var id: String { path }
    let title: String
    let path: String
}

final class Store: ObservableObject {

    let fig = FigByteStream()
    let fs: RemoteFS

    @Published var path = "/"
    @Published var items: [Entry] = []
    @Published var selection = Set<String>()
    @Published var sortKey: SortKey = .name
    @Published var sortAsc = true
    @Published var showHidden = true
    @Published var search = ""
    @Published var busy = false
    @Published var connected = false
    @Published var notice: Notice?
    @Published var logs: [String] = []
    @Published var bookmarks: [String] = []
    @Published var canGoBack = false
    @Published var canGoForward = false

    private var backStack: [String] = []
    private var fwdStack: [String] = []
    private var connecting = false
    private static let bookmarkKey = "mconffs.bookmarks"

    static let places: [Place] = [
        Place(name: "根目录", path: "/"),
        Place(name: "应用", path: "/Applications"),
        Place(name: "用户数据", path: "/var/mobile"),
        Place(name: "容器", path: "/var/mobile/Containers/Data/Application"),
        Place(name: "偏好设置", path: "/var/mobile/Library/Preferences"),
        Place(name: "系统", path: "/System"),
        Place(name: "系统库", path: "/usr/lib"),
        Place(name: "越狱", path: "/var/jb"),
        Place(name: "临时", path: "/tmp"),
    ]

    init() {
        fs = RemoteFS(fig: fig)
        fig.onLog = { [weak self] s in self?.append(s) }
        fs.onLog = { [weak self] s in self?.append(s) }
        bookmarks = UserDefaults.standard.stringArray(forKey: Self.bookmarkKey) ?? []
        // 不要在这里调 connect()：Store 由 @StateObject 创建，init 期间改 @Published
        // 等于在视图构建过程中发布变化，SwiftUI 会判成未定义行为（启动即崩）。
        // 连接动作放到 RootView.onAppear 里做。
    }

    // MARK: - 基础

    func append(_ s: String) {
        DispatchQueue.main.async {
            self.logs.append(s)
            if self.logs.count > 600 { self.logs.removeFirst(self.logs.count - 600) }
        }
    }

    func connect() {
        guard !connecting else { return }
        connecting = true
        busy = true
        DispatchQueue.global(qos: .userInitiated).async {
            let ok = self.fig.connect()
            DispatchQueue.main.async {
                self.connecting = false
                self.connected = ok
                self.busy = false
                if !ok { self.notice = Notice(text: "连接失败：\(self.fig.lastError)") }
                if ok { self.reload() }
            }
        }
    }

    var filtered: [Entry] {
        var list = items
        if !showHidden { list = list.filter { !$0.name.hasPrefix(".") } }
        if !search.isEmpty {
            list = list.filter { $0.name.localizedCaseInsensitiveContains(search) }
        }
        let asc = sortAsc
        list.sort { a, b in
            if a.isDirectory != b.isDirectory { return a.isDirectory }
            let r: Bool
            switch sortKey {
            case .name: r = a.name.localizedStandardCompare(b.name) == .orderedAscending
            case .size: r = a.size < b.size
            case .date: r = (a.modified ?? .distantPast) < (b.modified ?? .distantPast)
            case .kind: r = a.ext < b.ext
            }
            return asc ? r : !r
        }
        return list
    }

    var crumbs: [Crumb] {
        var out: [Crumb] = [Crumb(title: "根", path: "/")]
        var acc = ""
        for comp in path.split(separator: "/") {
            acc += "/" + comp
            out.append(Crumb(title: String(comp), path: acc))
        }
        return out
    }

    var parentPath: String {
        let p = (path as NSString).deletingLastPathComponent
        return p.isEmpty ? "/" : p
    }

    // MARK: - 导航

    func go(_ newPath: String, push: Bool = true) {
        guard !newPath.isEmpty else { return }
        if push && newPath != path {
            backStack.append(path)
            fwdStack.removeAll()
        }
        path = newPath
        search = ""
        selection.removeAll()
        updateNavFlags()
        reload()
    }

    func goUp() { go(parentPath) }

    func goBack() {
        guard let p = backStack.popLast() else { return }
        fwdStack.append(path)
        path = p
        updateNavFlags()
        reload()
    }

    func goForward() {
        guard let p = fwdStack.popLast() else { return }
        backStack.append(path)
        path = p
        updateNavFlags()
        reload()
    }

    private func updateNavFlags() {
        canGoBack = !backStack.isEmpty
        canGoForward = !fwdStack.isEmpty
    }

    func reload() {
        busy = true
        let p = path
        DispatchQueue.global(qos: .userInitiated).async {
            do {
                let list = try self.fs.list(path: p)
                DispatchQueue.main.async {
                    if self.path == p { self.items = list }
                    self.busy = false
                }
            } catch {
                DispatchQueue.main.async {
                    if self.path == p { self.items = [] }
                    self.busy = false
                    self.notice = Notice(text: "无法列出 \(p)：\(error.localizedDescription)")
                }
            }
        }
    }

    // MARK: - 操作

    func run(_ label: String, _ work: @escaping () throws -> String) {
        busy = true
        DispatchQueue.global(qos: .userInitiated).async {
            do {
                let msg = try work()
                DispatchQueue.main.async {
                    self.append("[\(label)] \(msg)")
                    self.busy = false
                    self.reload()
                }
            } catch {
                DispatchQueue.main.async {
                    self.busy = false
                    self.notice = Notice(text: "\(label) 失败：\(error.localizedDescription)")
                }
            }
        }
    }

    func mkdir(name: String) {
        let target = path.hasSuffix("/") ? path + name : path + "/" + name
        run("新建文件夹") { try self.fs.mkdir(path: target); return target }
    }

    func newFile(name: String) {
        let target = path.hasSuffix("/") ? path + name : path + "/" + name
        run("新建文件") { try self.fs.create(path: target); return target }
    }

    func delete(_ entries: [Entry]) {
        run("删除") {
            var n = 0
            for e in entries { try self.fs.remove(path: e.path); n += 1 }
            return "已删除 \(n) 项"
        }
    }

    func rename(_ entry: Entry, to newName: String) {
        let dir = (entry.path as NSString).deletingLastPathComponent
        run("重命名") { try self.fs.rename(from: entry.path, to: dir + "/" + newName); return newName }
    }

    func copy(_ entries: [Entry], toDir dir: String) {
        run("复制") {
            for e in entries { try self.fs.copy(from: e, toDir: dir) }
            return "\(entries.count) 项 → \(dir)"
        }
    }

    func move(_ entries: [Entry], toDir dir: String) {
        run("移动") {
            for e in entries { try self.fs.move(from: e, toDir: dir) }
            return "\(entries.count) 项 → \(dir)"
        }
    }

    func duplicate(_ entry: Entry) {
        run("复制副本") { try self.fs.duplicate(entry); return entry.name }
    }

    func chmod(_ entry: Entry, mode: mode_t) {
        run("改权限") {
            try self.fs.chmod(path: entry.path, mode: mode)
            return "\(entry.name) → \(String(format: "%03o", mode))"
        }
    }

    func download(_ entry: Entry) {
        run("下载") {
            let data = try self.fs.read(path: entry.path, maxSize: 512 << 20)
            let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
            let dst = dir.appendingPathComponent(entry.name)
            try data.write(to: dst)
            return "\(dst.path)（\(Fmt.size(Int64(data.count)))）"
        }
    }

    func upload(local: URL, toDir dir: String) {
        let secured = local.startAccessingSecurityScopedResource()
        defer { if secured { local.stopAccessingSecurityScopedResource() } }
        guard let data = try? Data(contentsOf: local) else {
            notice = Notice(text: "读取本地文件失败")
            return
        }
        let dst = dir.hasSuffix("/") ? dir + local.lastPathComponent : dir + "/" + local.lastPathComponent
        run("上传") { try self.fs.write(path: dst, data: data); return "\(dst)（\(Fmt.size(Int64(data.count)))）" }
    }

    func compress(_ entries: [Entry]) {
        run("压缩") {
            var payload: [(String, Data)] = []
            var total = 0
            for e in entries { try self.collect(e, base: "", into: &payload, total: &total) }
            let archive = Zip.archive(payload.map { (name: $0.0, data: $0.1) })
            let name = entries.count == 1
                ? (entries[0].name as NSString).deletingPathExtension
                : "archive-\(Int(Date().timeIntervalSince1970))"
            let dst = self.path.hasSuffix("/") ? self.path + name + ".zip" : self.path + "/" + name + ".zip"
            try self.fs.write(path: dst, data: archive)
            return "\(dst)（\(payload.count) 个文件，\(Fmt.size(Int64(archive.count)))）"
        }
    }

    private func collect(_ e: Entry, base: String, into acc: inout [(String, Data)], total: inout Int) throws {
        let rel = base.isEmpty ? e.name : base + "/" + e.name
        if e.isDirectory {
            for child in try fs.list(path: e.path) {
                try collect(child, base: rel, into: &acc, total: &total)
            }
        } else {
            let data = try fs.read(path: e.path, maxSize: 256 << 20)
            total += data.count
            if total > (256 << 20) { throw FSError.fig("超过 256MB，放弃压缩") }
            acc.append((rel, data))
        }
    }

    func uncompress(_ entry: Entry) {
        run("解压") {
            let data = try self.fs.read(path: entry.path, maxSize: 512 << 20)
            let items = Zip.entries(data)
            guard !items.isEmpty else { throw FSError.fig("不是有效的 zip") }
            let base = self.path.hasSuffix("/")
                ? self.path + (entry.name as NSString).deletingPathExtension
                : self.path + "/" + (entry.name as NSString).deletingPathExtension
            try? self.fs.mkdir(path: base)
            var made = Set<String>()
            var n = 0
            for it in items {
                let dst = base + "/" + it.name
                let comps = it.name.split(separator: "/").dropLast()
                var acc = base
                for c in comps {
                    acc += "/" + String(c)
                    if !made.contains(acc) { try? self.fs.mkdir(path: acc); made.insert(acc) }
                }
                guard let payload = Zip.extract(data, it) else { continue }
                try self.fs.write(path: dst, data: payload)
                n += 1
            }
            return "\(n) 个文件 → \(base)"
        }
    }

    // MARK: - 收藏

    func toggleBookmark(_ p: String) {
        if let i = bookmarks.firstIndex(of: p) { bookmarks.remove(at: i) } else { bookmarks.append(p) }
        UserDefaults.standard.set(bookmarks, forKey: Self.bookmarkKey)
    }

    func isBookmarked(_ p: String) -> Bool { bookmarks.contains(p) }
}
