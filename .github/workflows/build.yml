## 6. 已知不确定项 —— 改动必须写进报告

1. **四个 Fig 私有函数的 C 签名是依据实际调用点反推的**，不是来自 SDK 头文件。
   `FigByteStream` 默认走 `.direct` 模式（只发一条消息，不涉及这四个函数）。
   只有第 5 节第 3 步拿不到 fd 时，才去 `活动` tab 打开「启用 memory-origin 握手」再试一次。
   仍失败则用日志里的 `xpc_copy_description` 输出记录 reply 结构，写进报告。
2. **服务端是否接受 `O_RDWR`** 需要在设备上实测。第 5 节第 5 步就是判定点。
3. **`unlinkat` / `renameat` / `mkdirat` 是否放行** 取决于目标路径的系统策略，属实测项。
   `move` 已实现为「先 `renameat`，失败退化为复制+删除」。
4. 目录打开**必须**用 `O_RDONLY`。把 `FileOpenOptions` 统一改成 `O_RDWR` 去 open 目录会 `EISDIR`，
   列目录功能直接失效。这条不要「顺手优化」。

