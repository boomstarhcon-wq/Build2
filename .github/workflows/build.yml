import SwiftUI
import UIKit

// MARK: - 位置

struct PlacesView: View {
    @EnvironmentObject var store: Store
    @Binding var tab: Int

    var body: some View {
        NavigationView {
            List {
                Section("常用位置") {
                    ForEach(Store.places) { place in
                        Button { open(place.path) } label: {
                            HStack {
                                Image(systemName: icon(place.path)).frame(width: 22)
                                Text(place.name)
                                Spacer()
                                Text(place.path).font(.system(size: 10, design: .monospaced)).foregroundColor(.secondary)
                            }
                        }
                    }
                }
                Section("收藏") {
                    if store.bookmarks.isEmpty {
                        Text("在浏览时长按 ⋯ 菜单里收藏目录").font(.caption).foregroundColor(.secondary)
                    }
                    ForEach(store.bookmarks, id: \.self) { p in
                        Button { open(p) } label: {
                            HStack {
                                Image(systemName: "star.fill").foregroundColor(.yellow).frame(width: 22)
                                Text(p).font(.system(size: 12, design: .monospaced)).lineLimit(1)
                            }
                        }
                        .contextMenu {
                            Button(role: .destructive) { store.toggleBookmark(p) } label: { Text("移除收藏") }
                        }
                    }
                }
                Section("当前") {
                    HStack {
                        Text(store.path).font(.system(size: 12, design: .monospaced))
                        Spacer()
                        Button("打开") { open(store.path) }
                    }
                }
            }
            .listStyle(.insetGrouped)
            .navigationTitle("位置")
        }
        .navigationViewStyle(.stack)
    }

    private func open(_ p: String) {
        store.go(p)
        tab = 0
    }

    private func icon(_ p: String) -> String {
        if p == "/" { return "internaldrive" }
        if p.contains("Preferences") { return "gearshape" }
        if p.contains("Application") { return "square.grid.2x2" }
        if p.hasPrefix("/System") { return "cpu" }
        if p.hasPrefix("/var/jb") { return "wrench.and.screwdriver" }
        return "folder"
    }
}

// MARK: - 活动 / 设置

struct ActivityView: View {
    @EnvironmentObject var store: Store
    @State private var handshake = false

    var body: some View {
        NavigationView {
            List {
                Section("连接") {
                    HStack {
                        Text("服务")
                        Spacer()
                        Text(FigByteStream.serviceName)
                            .font(.system(size: 10, design: .monospaced))
                            .foregroundColor(.secondary)
