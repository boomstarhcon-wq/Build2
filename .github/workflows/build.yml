        }
        .navigationViewStyle(.stack)
    }
}

// MARK: - 预览

struct PreviewView: View {
    @EnvironmentObject var store: Store
    @Environment(\.presentationMode) private var presentation
    let entry: Entry

    @State private var text: String?
    @State private var image: UIImage?
    @State private var loading = true
    @State private var info = ""

    var body: some View {
        NavigationView {
            Group {
                if loading {
                    ProgressView("读取中…")
                } else if let img = image {
                    ScrollView([.horizontal, .vertical]) {
                        Image(uiImage: img).resizable().scaledToFit().padding()
                    }
                } else {
                    ScrollView([.horizontal, .vertical]) {
                        Text(text ?? "无法解码")
                            .font(.system(size: 11, design: .monospaced))
                            .textSelection(.enabled)
                            .padding(10)
                            .frame(maxWidth: .infinity, alignment: .leading)
                    }
                }
            }
            .navigationTitle(entry.name)
            .navigationBarTitleDisplayMode(.inline)
            .toolbar {
                ToolbarItem(placement: .cancellationAction) {
                    Button("关闭") { presentation.wrappedValue.dismiss() }
                }
                ToolbarItem(placement: .navigationBarTrailing) {
                    Menu {
                        Button { store.download(entry) } label: { Label("下载到本机", systemImage: "arrow.down.circle") }
                    } label: { Image(systemName: "square.and.arrow.down") }
                }
            }
            .safeAreaInset(edge: .bottom) {
                Text(info).font(.system(size: 10, design: .monospaced))
                    .foregroundColor(.secondary)
                    .frame(maxWidth: .infinity)
                    .padding(4)
                    .background(Color(.secondarySystemBackground))
            }
            .onAppear(perform: load)
        }
        .navigationViewStyle(.stack)
    }

    private func load() {
        DispatchQueue.global(qos: .userInitiated).async {
            let data = (try? store.fs.read(path: entry.path, maxSize: 8 << 20)) ?? Data()
            let ext = entry.ext
            var txt: String?
            var img: UIImage?
            if ["png", "jpg", "jpeg", "gif", "heic", "webp", "bmp", "tiff"].contains(ext) {
                img = UIImage(data: data)
            }
            if img == nil {
                if ["plist", "entitlements"].contains(ext),
                   let obj = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                   let pretty = try? PropertyListSerialization.data(fromPropertyList: obj, format: .xml, options: 0) {
                    txt = String(data: pretty, encoding: .utf8)
                } else if let s = String(data: data, encoding: .utf8), !s.isEmpty {
                    txt = s
                } else {
                    txt = HexDump.of(data)
                }
            }
            DispatchQueue.main.async {
                self.text = txt
                self.image = img
                self.info = "\(Fmt.size(entry.size)) · \(Fmt.perm(entry.mode)) · \(Fmt.date(entry.modified))"
                self.loading = false
            }
        }
    }
}

// MARK: - 属性

struct PropertiesView: View {
    @EnvironmentObject var store: Store
    @Environment(\.presentationMode) private var presentation
    let entry: Entry

    @State private var detail = ""

    var body: some View {
        NavigationView {
            List {
                Section("常规") {
                    row("名称", entry.name)
                    row("路径", entry.path)
                    row("类型", Fmt.kind(entry))
                    row("大小", entry.isDirectory ? "—" : Fmt.size(entry.size))
                    row("修改时间", Fmt.date(entry.modified))
                }
                Section("权限") {
                    row("八进制", String(format: "%04o", Int(entry.mode & 0o7777)))
                    row("rwx", Fmt.perm(entry.mode))
                    row("属主", "\(entry.uid):\(entry.gid)")
                    HStack {
                        ForEach([0o755, 0o644, 0o700, 0o600, 0o777], id: \.self) { m in
                            Button(String(format: "%o", m)) {
                                store.chmod(entry, mode: mode_t(m))
                            }
                            .buttonStyle(.bordered)
                            .controlSize(.small)
                        }
                    }
                }
                if let t = entry.linkTarget {
                    Section("链接目标") { Text(t).font(.system(size: 12, design: .monospaced)) }
                }
                Section("fd 级 stat") {
                    Text(detail.isEmpty ? "读取中…" : detail)
                        .font(.system(size: 10, design: .monospaced))
                        .foregroundColor(.secondary)
                }
            }
            .listStyle(.insetGrouped)
            .navigationTitle("属性")
            .toolbar { ToolbarItem(placement: .confirmationAction) { Button("完成") { presentation.wrappedValue.dismiss() } } }
            .onAppear {
                DispatchQueue.global().async {
                    guard let st = try? store.fs.statOf(path: entry.path) else {
                        DispatchQueue.main.async { self.detail = "不可读" }
                        return
                    }
                    let s = String(format: "st_mode=0%o  st_size=%lld\nst_uid=%d  st_gid=%d\nst_ino=%llu  st_nlink=%d",
                                   UInt32(st.st_mode), st.st_size, Int32(st.st_uid), Int32(st.st_gid),
                                   UInt64(st.st_ino), Int(st.st_nlink))
                    DispatchQueue.main.async { self.detail = s }
                }
            }
        }
        .navigationViewStyle(.stack)
    }

    private func row(_ k: String, _ v: String) -> some View {
        HStack(alignment: .top) {
            Text(k).foregroundColor(.secondary).frame(width: 78, alignment: .leading)
            Text(v).font(.system(size: 12, design: .monospaced)).textSelection(.enabled)
        }
        .font(.system(size: 13))
    }
}

// MARK: - 目录选择器

struct DirectoryPickerView: View {
    @EnvironmentObject var store: Store
    @Environment(\.presentationMode) private var presentation

    let entries: [Entry]
    let isCopy: Bool

    @State private var path: String
    @State private var items: [Entry] = []
    @State private var loading = false

    init(start: String, entries: [Entry], isCopy: Bool) {
        self.entries = entries
        self.isCopy = isCopy
        _path = State(initialValue: start)
    }

    var body: some View {
        NavigationView {
            List {
                Section {
                    HStack {
                        Text(path).font(.system(size: 11, design: .monospaced)).lineLimit(1)
                        Spacer()
                        Button("上级") { path = (path as NSString).deletingLastPathComponent; load() }
                    }
                }
                Section("目录") {
                    ForEach(items.filter { $0.isDirectory }) { d in
                        Button {
                            path = d.path
                            load()
                        } label: {
                            HStack {
                                Image(systemName: "folder.fill").foregroundColor(.accentColor)
                                Text(d.name).font(.system(size: 13, design: .monospaced))
                                Spacer()
                                Image(systemName: "chevron.right").font(.system(size: 10)).foregroundColor(.secondary)
                            }
                        }
                    }
                }
            }
            .listStyle(.insetGrouped)
            .navigationTitle(isCopy ? "复制到…" : "移动到…")
            .toolbar {
                ToolbarItem(placement: .cancellationAction) { Button("取消") { presentation.wrappedValue.dismiss() } }
                ToolbarItem(placement: .confirmationAction) {
                    Button("确定") {
                        if isCopy { store.copy(entries, toDir: path) } else { store.move(entries, toDir: path) }
                        presentation.wrappedValue.dismiss()
                    }
                }
            }
            .overlay { if loading { ProgressView() } }
            .onAppear(perform: load)
        }
        .navigationViewStyle(.stack)
    }

    private func load() {
        loading = true
        let p = path
        DispatchQueue.global().async {
            let list = (try? store.fs.list(path: p)) ?? []
            DispatchQueue.main.async {
                if self.path == p { self.items = list }
                self.loading = false
            }
        }
    }
}
