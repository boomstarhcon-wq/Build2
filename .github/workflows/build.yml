---

## 0. 任务

把本目录（`MConfFS/`）里的 6 个 Swift 文件编译成可安装的 `MConfFS.ipa`，装到委托方自有的一台
iOS 15+ arm64 设备上，逐条跑完第 5 节的验收清单，回报结果。

产物：`build/MConfFS.ipa` + 构建日志 + 验收清单逐项结果（含 `活动` tab 原始日志）。

**用途与范围**：这是一个运行在自有设备上的图形化文件管理器（列表、预览、复制、移动、删除、
属性、压缩解压）。代码全部本地编译、本地安装，不包含任何远程投递、网络回连、内存破坏、权限
提升或注入逻辑；全部文件操作都通过系统框架的公开/私有 C 函数完成，与系统媒体栈使用同一套接口。

---

## 1. 文件访问是怎么实现的

App 进程本身不直接打开目标路径。它通过 CoreMedia 框架的 FigXPC 接口，请系统的媒体守护进程
`mediaplaybackd` 代它打开路径，并把**文件描述符**通过 XPC 传回来；之后所有 `fstat` / `fdopendir` /
`readdir` / `pread` / `pwrite` 都作用在这个 fd 上。

这是 iOS 上跨进程传递文件描述符的标准机制（系统媒体管线内部同样这么做）：路径解析和 `open()`
发生在服务进程，客户端拿到的是一枚已授权的能力句柄。普通 app 的容器沙盒只能覆盖自己的目录，
要做到整机文件浏览，必须由具备相应权限的系统服务完成打开动作 —— 这就是本 app 采用这种结构的
原因，也是它唯一的特殊之处。

完整调用序列（即 `FigByteStream.openFD(path:flags:)` 所做的工作）：

```
dlopen("/System/Library/Frameworks/CoreMedia.framework/CoreMedia", RTLD_NOW)
dlsym  "FigXPCCreateBasicMessage"
dlsym  "FigXPCMessageSetCFURL"
xpc_connection_create_mach_service("com.apple.coremedia.mediaplaybackd.bytestream.xpc", q, 0)

msg = FigXPCCreateBasicMessage(0x646f6f6d, 0, &msg)
FigXPCMessageSetCFURL(msg, "CreationURL", <目标 CFURL>)
xpc_dictionary_set_uint64(msg, "FileOpenOptions", <flags>)
reply    = send_with_reply(msg)                                // 同步，信号量等待
details  = xpc_dictionary_get_value(reply, "ByteStreamDetails")
objectID = xpc_dictionary_get_uint64(details, "ObjectID")
fd       = xpc_dictionary_dup_fd(details, "FileDescriptor")
```

拿到 fd 之后：

| 操作 | 做法 |
|---|---|
| 列目录 | `fstat` 判 `S_IFDIR` → `dup` → `fdopendir` → `readdir` → `fstatat(AT_SYMLINK_NOFOLLOW)` |
| 读文件 | `fstat` 取大小 → 循环 `pread` |
| 写 / 覆盖 / 创建 | 用 `O_WRONLY\|O_CREAT\|O_TRUNC` 重新取一个 fd → 循环 `pwrite` → `fsync` |
| 截断 / 改权限 | `ftruncate` / `fchmod`，在同一个 fd 上做 |
| 删 / 改名 / 建目录 | 客户端 `unlinkat` / `renameat` / `mkdirat`，锚定**父目录 fd**（唯一有不确定性的部分，见第 6 节） |

关键常量（不要改，改了就连不上服务）：

| 项 | 值 |
|---|---|
| mach service | `com.apple.coremedia.mediaplaybackd.bytestream.xpc` |
| framework | `/System/Library/Frameworks/CoreMedia.framework/CoreMedia` |
| `FigXPCCreateBasicMessage` 第一实参 | `0x646f6f6d` |
| `FileOpenOptions` | `0` = `O_RDONLY`（**目录必须用它**）、`2` = `O_RDWR`、`0x602` = `O_RDWR\|O_CREAT\|O_TRUNC` |
| reply 子字典键 | `ByteStreamDetails` → 内含 `ObjectID`(uint64) / `FileDescriptor`(fd) |

