## 2. 代码结构

```
MConfFS/
  Sources/FigByteStream.swift   文件访问层（FigXPC 调用 + fd 获取），设计已定
  Sources/RemoteFS.swift        fd 级文件系统（pread/pwrite/fdopendir/openat 族）
  Sources/Store.swift           状态机：导航历史、排序、多选、压缩解压、上传下载
  Sources/RootView.swift        主界面：TabView + 面包屑 + 列表 + 长按菜单 + 选择栏
  Sources/Panels.swift          位置 / 活动 / 预览 / 属性 / 目录选择器
  Sources/Support.swift         格式化、图标、hex dump、最小 ZIP 读写
  Resources/Info.plist          CFBundleIdentifier = com.mconffs.browser
  build.sh                      一条命令出 ipa
```

所有 `xpc_*` 与 `Fig*` 都通过 `dlopen` + `dlsym` 解析，代码里**没有** `import XPC`，也没有链接
私有 framework 的 tbd。这是刻意的：保证在任意 Xcode/SDK 版本下都能过编译。

