<<<FILE MConfFS/build.sh>>>
#!/usr/bin/env bash
# 构建 + 打包 IPA + ad-hoc 重签。
# 产物：build/MConfFS.ipa（主程序）、build/MConfMin.ipa（最小验证包）
# 依赖：macOS + Xcode 命令行工具（xcrun / swiftc / codesign / zip / otool / plutil）
set -euo pipefail
cd "$(dirname "$0")"

APP="MConfFS"
OUT="build"
SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
echo "SDK: $SDK"
echo "swiftc: $(xcrun --sdk iphoneos swiftc --version 2>&1 | head -1)"

rm -rf "$OUT"
mkdir -p "$OUT/$APP.app"

# ---------------------------------------------------------------- 主程序
echo "==> 编译 arm64"
# 关键：-rpath /usr/lib/swift。手写 swiftc 不会像 Xcode 那样自动加 rpath，
# 缺了它 dyld 在启动时找不到 @rpath/libswiftCore.dylib，进程立刻被杀（表现为"打开即闪退"）。
xcrun --sdk iphoneos swiftc Sources/*.swift \
	-target arm64-apple-ios15.0 \
	-sdk "$SDK" \
	-parse-as-library -O -whole-module-optimization \
	-swift-version 5 \
	-framework SwiftUI -framework UIKit \
	-Xlinker -rpath -Xlinker /usr/lib/swift \
	-Xlinker -rpath -Xlinker @executable_path/Frameworks \
	-o "$OUT/$APP.app/$APP"

cp Resources/Info.plist "$OUT/$APP.app/Info.plist"
printf 'APPL????' > "$OUT/$APP.app/PkgInfo"

# ---------------------------------------------------------------- 诊断
# 诊断段落要大量用 | head，head 提前关闭管道会让上游 grep 收到 SIGPIPE（退出码 141），
# 在 pipefail 下会误判成构建失败，所以这段临时关掉 pipefail。
set +o pipefail
echo "==> 二进制诊断（这段决定了能不能启动）"
file "$OUT/$APP.app/$APP"
echo "--- load commands ---"
otool -l "$OUT/$APP.app/$APP" | grep -E "cmd LC_(MAIN|BUILD_VERSION|RPATH|UUID|LOAD_DYLIB)" -A 3 | head -60
echo "--- linked dylibs ---"
otool -L "$OUT/$APP.app/$APP"
echo "--- rpath 自检 ---"
otool -l "$OUT/$APP.app/$APP" | grep -A2 LC_RPATH || {
	echo "!! 没有 LC_RPATH，启动会因找不到 Swift 运行时闪退"; exit 1; }
echo "--- entry point ---"
otool -l "$OUT/$APP.app/$APP" | grep -A4 LC_MAIN || {
	echo "!! 没有 LC_MAIN，系统不会启动这个可执行文件"; exit 1; }
echo "--- Info.plist ---"
plutil -lint "$OUT/$APP.app/Info.plist"
plutil -p "$OUT/$APP.app/Info.plist" | head -30

echo "==> ad-hoc 重签（不需要证书）"
set -o pipefail
# 不要用 || true 吞掉签名失败：未签名的 app 装上后会被系统立刻终止，
# 表现出来和"打开即闪退"一模一样，极难排查。
codesign --force --deep --sign - "$OUT/$APP.app"
codesign -dv "$OUT/$APP.app" 2>&1 | sed -n '1,6p'
codesign --verify --deep --strict "$OUT/$APP.app" && echo "signature OK"
echo "--- entitlements ---"
codesign -d --entitlements :- "$OUT/$APP.app" 2>&1 | head -20 || true

echo "==> 打包 IPA"
rm -rf "$OUT/Payload"
mkdir -p "$OUT/Payload"
cp -R "$OUT/$APP.app" "$OUT/Payload/"
( cd "$OUT" && zip -qry "$APP.ipa" Payload )

# ---------------------------------------------------------------- 最小验证包
# 只有一行 SwiftUI Text，不 import 任何私有符号、不碰 XPC。
# 用途：如果主程序闪退，先装这个——能起来说明是代码问题，起不来说明是包/签名问题。
echo "==> 构建最小验证包（用于区分「环境问题」和「代码问题」）"
MIN="MConfMin"
mkdir -p "$OUT/$MIN.app"
cat > "$OUT/min.swift" <<'__MIN_SWIFT__'
import SwiftUI

@main
struct MinApp: App {
    var body: some Scene {
        WindowGroup {
            VStack(spacing: 12) {
                Text("MConfMin OK").font(.largeTitle.bold())
                Text("构建与安装链路正常").font(.footnote)
            }
        }
    }
}
__MIN_SWIFT__

xcrun --sdk iphoneos swiftc "$OUT/min.swift" \
	-target arm64-apple-ios15.0 \
	-sdk "$SDK" \
	-parse-as-library -O \
	-swift-version 5 \
	-framework SwiftUI -framework UIKit \
	-Xlinker -rpath -Xlinker /usr/lib/swift \
	-o "$OUT/$MIN.app/$MIN"

python3 - "$OUT/$MIN.app/Info.plist" <<'__MIN_PLIST__'
import plistlib, sys
p = {
    "CFBundleDevelopmentRegion": "en",
    "CFBundleDisplayName": "MConfMin",
    "CFBundleExecutable": "MConfMin",
    "CFBundleIdentifier": "com.mconffs.min",
    "CFBundleInfoDictionaryVersion": "6.0",
    "CFBundleName": "MConfMin",
    "CFBundlePackageType": "APPL",
    "CFBundleShortVersionString": "1.0",
    "CFBundleVersion": "1",
    "CFBundleSupportedPlatforms": ["iPhoneOS"],
    "LSRequiresIPhoneOS": True,
    "MinimumOSVersion": "15.0",
    "UIDeviceFamily": [1, 2],
    "UIRequiredDeviceCapabilities": ["arm64"],
    "UILaunchScreen": {},
    "UIApplicationSceneManifest": {"UIApplicationSupportsMultipleScenes": False},
    "UISupportedInterfaceOrientations": ["UIInterfaceOrientationPortrait"],
}
with open(sys.argv[1], "wb") as f:
    plistlib.dump(p, f, fmt=plistlib.FMT_BINARY)
print("wrote", sys.argv[1])
__MIN_PLIST__
printf 'APPL????' > "$OUT/$MIN.app/PkgInfo"
codesign --force --deep --sign - "$OUT/$MIN.app"
codesign --verify --deep --strict "$OUT/$MIN.app" && echo "min signature OK"

rm -rf "$OUT/MinPayload"
mkdir -p "$OUT/MinPayload"
cp -R "$OUT/$MIN.app" "$OUT/MinPayload/"
( cd "$OUT" && zip -qry "$MIN.ipa" MinPayload )

# ---------------------------------------------------------------- 汇总
echo
echo "完成:"
ls -la "$OUT"/*.ipa
echo
echo "安装顺序（排查用）:"
echo "  1) 先装 $OUT/$MIN.ipa —— 起来就是蓝底两行字 = 环境 OK；起不来 = 包/签名问题"
echo "  2) 再装 $OUT/$APP.ipa —— 若它崩而 Min 正常，问题在代码，看活动页日志"
<<<END FILE>>>

